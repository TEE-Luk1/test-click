name: Build Windows EXE

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4

      - name: 安裝 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝相依套件
        run: |
          python -m pip install --upgrade pip
          pip install opencv-python mss pyautogui pillow numpy keyboard pyinstaller

      - name: 打包執行檔
        run: |
          pyinstaller --noconfirm --onefile --windowed `
            --name "ImageAutoClicker" `
            --collect-all mss `
            --collect-all pyautogui `
            --hidden-import keyboard `
            --hidden-import PIL._tkinter_finder `
            image_auto_clicker.py

      - name: 上傳成品
        uses: actions/upload-artifact@v4
        with:
          name: ImageAutoClicker-Windows
          path: dist/ImageAutoClicker.exe
          retention-days: 30
